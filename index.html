<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>French Grammar Review Book</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Reviewed learning dataset</p>
    <h1>French Grammar Review Book</h1>
    <p>Lessons are transcribed from OCR sources and reviewed one section at a time.</p>
    <p><a href="teacher/index.html">Teacher Dashboard →</a> · <a href="README.md">Teacher Manual →</a></p>
  </header>

  <main class="reader">
    <nav aria-label="Lesson list">
      <div class="source-toggle" role="group" aria-label="Content source">
        <button id="btn-reviewed" class="source-btn active" aria-pressed="true">Reviewed</button>
        <button id="btn-sections" class="source-btn" aria-pressed="false">OCR Sections</button>
      </div>
      <label for="lesson-filter">Find a lesson</label>
      <input id="lesson-filter" type="search" placeholder="Search lessons">
      <ol id="lesson-list"></ol>
    </nav>
    <article id="lesson" aria-live="polite">
      <p>Select a lesson from the list.</p>
    </article>
  </main>

  <script src="assets/reader.js"></script>
</body>
</html>
