name: Build and deploy French textbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -r assets site/assets
          cp -r data site/data
          cp -r sections site/sections
          python3 - <<'EOF'
          import json, os, re
          files = sorted(f for f in os.listdir("sections") if f.endswith(".md"))
          records = []
          for f in files:
              stem = f[:-3]
              title = re.sub(r"^\d+-", "", stem).replace("-", " ").title()
              records.append({"id": stem, "title": title, "path": f"sections/{f}"})
          with open("site/sections/index.json", "w") as fh:
              json.dump(records, fh, ensure_ascii=False, indent=2)
          EOF
          test -s site/index.html
          test -f site/data/sections/index.json
          test -f site/sections/index.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
