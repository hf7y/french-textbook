name: Build and deploy French textbook

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download published Google Doc
        run: |
          mkdir -p site
          curl -L --fail --silent --show-error \
            'https://docs.google.com/document/d/e/2PACX-1vRVOW0pxe7g5BDTNBI-UTOEyNzZ4-rrSlifbIT_zt4uegTOZFrJuIGFhUhC6Fujkg/pub' \
            -o site/index.html
          test -s site/index.html

      - name: Add basic page metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8', errors='replace')
          if '<base ' not in s.lower():
              s = s.replace('<head>', '<head><base href="https://docs.google.com/">', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
